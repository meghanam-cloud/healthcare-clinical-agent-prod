# Secret scope dbx-secret-scope is created and managed out-of-band
# (via Databricks CLI or UI). Secrets are populated manually.
# Do not recreate it through the bundle — it already exists.
#
# To set up from scratch:
#   databricks secrets create-scope dbx-secret-scope
#   databricks secrets put-secret dbx-secret-scope DATABRICKS_TOKEN --string-value <token>
#   databricks secrets put-secret dbx-secret-scope LANGFUSE_PUBLIC_KEY --string-value <key>
#   databricks secrets put-secret dbx-secret-scope LANGFUSE_SECRET_KEY --string-value <key>
#   databricks secrets put-secret dbx-secret-scope LANGFUSE_HOST --string-value <host>
#   bash scripts/grant_secret_scope_acl.sh ecom-agent-app dbx-secret-scope
